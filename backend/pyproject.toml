[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucovida-backend"
version = "0.1.0"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4.2,<6",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2,<3",
    "pydantic-settings>=2,<3",
    "PyJWT[crypto]>=2.10,<3",
    "redis>=5,<9",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "aiosmtpd>=1.4,<2",
    "fakeredis>=2,<3",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "trustme>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
"app.legal" = ["documents/*.md", "documents/*.json"]
